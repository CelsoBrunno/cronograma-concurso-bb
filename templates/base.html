{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Estudos BB{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'estudos:dashboard' %}">Estudos BB</a>
    <nav>
      <a href="{% url 'estudos:dashboard' %}">Painel</a>
      <a href="{% url 'estudos:cronograma' %}">Cronograma</a>
      <a href="{% url 'estudos:fila' %}">Fila do dia</a>
      <a href="{% url 'estudos:disciplinas' %}">Disciplinas</a>
      <a href="{% url 'estudos:iniciar_sessao' %}">Nova sessão</a>
      <a href="{% url 'estudos:historico' %}">Histórico</a>
    </nav>
  </header>

  <main class="container">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
