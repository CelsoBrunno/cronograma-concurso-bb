{% extends "base.html" %}
{% block title %}Nova sessão · Estudos BB{% endblock %}
{% block content %}
<section class="stack">
  <div>
    <h1>Nova sessão</h1>
    <p class="muted">Cronômetro + log de questões no mesmo fluxo ao finalizar.</p>
  </div>

  <form method="post" class="card stack">
    {% csrf_token %}
    <label>
      Disciplina (opcional)
      <select name="disciplina" id="disciplina">
        <option value="">— livre / sem disciplina —</option>
        {% for d in disciplinas %}
        <option value="{{ d.id }}" {% if disciplina and disciplina.id == d.id %}selected{% endif %}>{{ d.nome }}</option>
        {% endfor %}
      </select>
    </label>

    <label>
      Tópico (opcional)
      <select name="topico" id="topico">
        <option value="">— sem tópico específico —</option>
        {% if topico %}
        <option value="{{ topico.id }}" selected>{{ topico.titulo }}</option>
        {% endif %}
        {% for t in topicos %}
          {% if not topico or t.id != topico.id %}
          <option value="{{ t.id }}">{{ t.titulo }}</option>
          {% endif %}
        {% endfor %}
      </select>
    </label>

    <div class="actions">
      <button type="submit">Iniciar cronômetro</button>
      <a class="btn secondary" href="{% url 'estudos:dashboard' %}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
